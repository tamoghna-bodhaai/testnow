services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: testnow
      POSTGRES_USER: testnow
      POSTGRES_PASSWORD: testnow
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testnow -d testnow"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes:
      - redis_data:/data
  objectstore:
    image: chrislusf/seaweedfs:latest
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: testnow
    ports: ["9000:8333"]
    volumes:
      - objectstore_data:/data
  api:
    build: ./apps/api
    restart: on-failure
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg://testnow:testnow@postgres:5432/testnow
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://objectstore:8333
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: testnow
      SESSION_SECRET: development-only-change-me
      SUPER_ADMIN_ACCESS_CODE: ${SUPER_ADMIN_ACCESS_CODE:-12345}
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:3000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-3.1-flash-lite}
      OPENROUTER_FALLBACK_MODEL: ${OPENROUTER_FALLBACK_MODEL:-}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-90}
      SEED_DEMO_DATA: "false"
    depends_on: [postgres, redis, objectstore]
    ports: ["8000:8000"]
  worker:
    build: ./apps/api
    restart: on-failure
    command: celery -A app.tasks.celery_app worker --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg://testnow:testnow@postgres:5432/testnow
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://objectstore:8333
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: testnow
      SESSION_SECRET: development-only-change-me
      SUPER_ADMIN_ACCESS_CODE: ${SUPER_ADMIN_ACCESS_CODE:-12345}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-3.1-flash-lite}
      OPENROUTER_FALLBACK_MODEL: ${OPENROUTER_FALLBACK_MODEL:-}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-90}
      SEED_DEMO_DATA: "false"
    depends_on: [postgres, redis, objectstore]
  explainer-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.render
    restart: on-failure
    environment:
      DATABASE_URL: postgresql+psycopg://testnow:testnow@postgres:5432/testnow
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://objectstore:8333
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: testnow
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      EXPLAINER_MODEL: ${EXPLAINER_MODEL:-google/gemini-3.1-flash-lite}
      EXPLAINER_TTS_MODEL: ${EXPLAINER_TTS_MODEL:-mistralai/voxtral-mini-tts-3-0}
      EXPLAINER_TTS_VOICE: ${EXPLAINER_TTS_VOICE:-voice_3153}
    depends_on: [postgres, redis, objectstore]
  scheduler:
    build: ./apps/api
    restart: on-failure
    command: celery -A app.tasks.celery_app beat --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg://testnow:testnow@postgres:5432/testnow
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://objectstore:8333
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: testnow
      SESSION_SECRET: development-only-change-me
      SUPER_ADMIN_ACCESS_CODE: ${SUPER_ADMIN_ACCESS_CODE:-12345}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-3.1-flash-lite}
      OPENROUTER_FALLBACK_MODEL: ${OPENROUTER_FALLBACK_MODEL:-}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-90}
      SEED_DEMO_DATA: "false"
    depends_on: [postgres, redis, objectstore]

volumes:
  postgres_data:
  redis_data:
  objectstore_data:
