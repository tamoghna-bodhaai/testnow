services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: testnow
      POSTGRES_USER: testnow
      POSTGRES_PASSWORD: testnow
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testnow -d testnow"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  objectstore:
    image: chrislusf/seaweedfs:latest
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: testnow
    ports: ["9000:8333"]
  api:
    build: ./apps/api
    restart: on-failure
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg://testnow:testnow@postgres:5432/testnow
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://objectstore:8333
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: testnow
      SESSION_SECRET: development-only-change-me
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:3000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      OPENROUTER_FALLBACK_MODEL: ${OPENROUTER_FALLBACK_MODEL:-}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-90}
      SEED_DEMO_DATA: "true"
    depends_on: [postgres, redis, objectstore]
    ports: ["8000:8000"]
  worker:
    build: ./apps/api
    restart: on-failure
    command: celery -A app.tasks.celery_app worker --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg://testnow:testnow@postgres:5432/testnow
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://objectstore:8333
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: testnow
      SESSION_SECRET: development-only-change-me
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      OPENROUTER_FALLBACK_MODEL: ${OPENROUTER_FALLBACK_MODEL:-}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-90}
      SEED_DEMO_DATA: "true"
    depends_on: [postgres, redis, objectstore]
