[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qbfac"
version = "0.1.0"
description = "Question Bank Factory: validated portable releases for JEE-oriented assessment banks"
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.27,<2"]

[project.scripts]
qbfac = "qbfac.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
